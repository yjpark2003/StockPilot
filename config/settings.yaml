server:
  host: "0.0.0.0"
  port: 8000

paths:
  reports: "reports/weekly"
  templates: "templates"

scheduler:
  enabled: true
  cron: "0 18 * * *"  # 매일 오후 6시

# 전체 단계 시간(초): 프로세스 시작·수집·정리 포함. 자동 재시도 없음.
collection_timeouts:
  browser_setup: 15
  navigation: 15
  price: 25
  news: 30
  financial: 30
  short_interest: 30
  benchmark: 20
  cleanup: 10
  stock: 90
  consecutive_timeouts: 3
